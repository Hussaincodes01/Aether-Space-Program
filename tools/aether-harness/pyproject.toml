[project]
name = "aether-harness"
version = "0.4.0"
description = "LLM harness for parameterised exoplanet surface generation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
image = ["Pillow>=10.0"]

[project.scripts]
aether = "aether_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
