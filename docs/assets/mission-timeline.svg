<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Timeline of exoplanet missions available in Aether">
  <title>Mission coverage, 1990-2045</title>
  <desc>Which missions Aether models, when they operated, and what each one can constrain. Colour encodes the kind of evidence a mission supplies.</desc>

  <rect width="880" height="470" fill="#070b14"/>

  <!-- decade gridlines -->
  <g stroke="#5ea8ff" stroke-opacity="0.09">
    <line x1="150" y1="46" x2="150" y2="408"/>
    <line x1="277" y1="46" x2="277" y2="408"/>
    <line x1="404" y1="46" x2="404" y2="408"/>
    <line x1="532" y1="46" x2="532" y2="408"/>
    <line x1="659" y1="46" x2="659" y2="408"/>
    <line x1="786" y1="46" x2="786" y2="408"/>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#6f8ab5" text-anchor="middle">
    <text x="150" y="428">1990</text><text x="277" y="428">2000</text><text x="404" y="428">2010</text>
    <text x="532" y="428">2020</text><text x="659" y="428">2030</text><text x="786" y="428">2040</text>
  </g>

  <!-- "today" marker -->
  <line x1="608" y1="40" x2="608" y2="408" stroke="#7ee081" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="608" y="34" fill="#7ee081" font-family="ui-monospace,Menlo,monospace" font-size="11" text-anchor="middle">today</text>

  <!-- bars. blue = finds planets, amber = measures atmospheres, green = stars and masses -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="11">
    <text x="140" y="63"  fill="#d8e8ff" text-anchor="end">HST</text>
    <rect x="150" y="54" width="458" height="12" rx="3" fill="#ffb454" fill-opacity="0.8"/>

    <text x="140" y="85"  fill="#d8e8ff" text-anchor="end">Ground RV</text>
    <rect x="214" y="76" width="394" height="12" rx="3" fill="#7ee081" fill-opacity="0.8"/>

    <text x="140" y="107" fill="#d8e8ff" text-anchor="end">Spitzer</text>
    <rect x="315" y="98" width="216" height="12" rx="3" fill="#ffb454" fill-opacity="0.8"/>

    <text x="140" y="129" fill="#d8e8ff" text-anchor="end">Ground transit</text>
    <rect x="328" y="120" width="280" height="12" rx="3" fill="#5ea8ff" fill-opacity="0.8"/>

    <text x="140" y="151" fill="#d8e8ff" text-anchor="end">Direct imaging</text>
    <rect x="328" y="142" width="280" height="12" rx="3" fill="#ffb454" fill-opacity="0.8"/>

    <text x="140" y="173" fill="#d8e8ff" text-anchor="end">CoRoT</text>
    <rect x="354" y="164" width="76" height="12" rx="3" fill="#5ea8ff" fill-opacity="0.8"/>

    <text x="140" y="195" fill="#d8e8ff" text-anchor="end">Kepler</text>
    <rect x="392" y="186" width="51" height="12" rx="3" fill="#5ea8ff" fill-opacity="0.8"/>

    <text x="140" y="217" fill="#d8e8ff" text-anchor="end">Gaia</text>
    <rect x="443" y="208" width="165" height="12" rx="3" fill="#7ee081" fill-opacity="0.8"/>

    <text x="140" y="239" fill="#d8e8ff" text-anchor="end">K2</text>
    <rect x="456" y="230" width="51" height="12" rx="3" fill="#5ea8ff" fill-opacity="0.8"/>

    <text x="140" y="261" fill="#d8e8ff" text-anchor="end">TESS</text>
    <rect x="507" y="252" width="101" height="12" rx="3" fill="#5ea8ff" fill-opacity="0.8"/>

    <text x="140" y="283" fill="#d8e8ff" text-anchor="end">JWST</text>
    <rect x="558" y="274" width="50" height="12" rx="3" fill="#ffb454" fill-opacity="0.95"/>

    <!-- planned: dashed outline, because nothing derived from them is data -->
    <text x="140" y="305" fill="#8ba4c9" text-anchor="end">PLATO</text>
    <rect x="608" y="296" width="76" height="12" rx="3" fill="none" stroke="#5ea8ff" stroke-opacity="0.65" stroke-dasharray="4 3"/>

    <text x="140" y="327" fill="#8ba4c9" text-anchor="end">Roman</text>
    <rect x="621" y="318" width="76" height="12" rx="3" fill="none" stroke="#5ea8ff" stroke-opacity="0.65" stroke-dasharray="4 3"/>

    <text x="140" y="349" fill="#8ba4c9" text-anchor="end">Ariel</text>
    <rect x="646" y="340" width="76" height="12" rx="3" fill="none" stroke="#ffb454" stroke-opacity="0.65" stroke-dasharray="4 3"/>

    <text x="140" y="371" fill="#8ba4c9" text-anchor="end">HWO</text>
    <rect x="786" y="362" width="64" height="12" rx="3" fill="none" stroke="#ffb454" stroke-opacity="0.65" stroke-dasharray="4 3"/>
    <text x="782" y="372" fill="#ffb454" fill-opacity="0.8" text-anchor="end" font-size="10">only route to a surface constraint →</text>
  </g>

  <!-- legend -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="11">
    <rect x="150" y="446" width="11" height="11" rx="2" fill="#5ea8ff" fill-opacity="0.8"/>
    <text x="168" y="456" fill="#8ba4c9">finds planets</text>
    <rect x="290" y="446" width="11" height="11" rx="2" fill="#ffb454" fill-opacity="0.8"/>
    <text x="308" y="456" fill="#8ba4c9">measures atmospheres</text>
    <rect x="490" y="446" width="11" height="11" rx="2" fill="#7ee081" fill-opacity="0.8"/>
    <text x="508" y="456" fill="#8ba4c9">stars and masses</text>
    <rect x="650" y="446" width="11" height="11" rx="2" fill="none" stroke="#8ba4c9" stroke-dasharray="3 2"/>
    <text x="668" y="456" fill="#8ba4c9">not yet launched</text>
  </g>
</svg>
