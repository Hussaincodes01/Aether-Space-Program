name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.test.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json declares
      # "packageManager": "pnpm@9.15.0", and pnpm/action-setup@v4 fails outright with
      # "Multiple versions of pnpm specified" if it is told a version as well. Letting it
      # read packageManager also keeps CI pinned to the exact version that wrote the
      # lockfile, rather than drifting to whatever 9.x is newest.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # Includes the gates the PRD requires to block a merge:
      #   - LLM containment (§19.1): no forbidden field may reach ScienceSpec
      #   - catalog diversity (§9.5): no two worlds may be near-duplicates
      #   - physics property tests (§9): monotonicity, unit invariance, domain enforcement
      - name: Test
        id: test
        run: |
          pnpm run test 2>&1 | tee test-output.txt
          passed=$(grep -oE 'Tests +[0-9]+ passed' test-output.txt \
                   | grep -oE '[0-9]+' | paste -sd+ - | bc || echo 0)
          echo "summary=${passed} tests passed" >> "$GITHUB_OUTPUT"

      # Root build covers both halves: every package via tsc, then the web client via Vite.
      # Building only the client used to hide package build breakage, because the client
      # resolves workspace packages through their sources rather than their emitted output.
      - name: Build
        run: pnpm run build

      - name: Build client explicitly
        run: pnpm --filter @aether/web run build

      # Unit tests cannot see a blank canvas, a lost WebGL context or a planet parked inside
      # its own star, and each of those shipped past every step above. This drives the built
      # client in headless Chromium with software WebGL. See apps/web/e2e/smoke.mjs.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm run test:browser

      # The rendered canvas at each stop, so a red run can be looked at rather than guessed at.
      - name: Upload smoke-test frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-frames
          path: apps/web/e2e/output/
          if-no-files-found: ignore

  # Posts a build result to Discord after every push to main.
  #
  # Requires a repository secret named DISCORD_WEBHOOK. Without it this job is a no-op
  # rather than a failure — a missing notification must never break the build.
  # Create one in Discord: Server Settings > Integrations > Webhooks > New Webhook.
  notify:
    needs: check
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RESULT: ${{ needs.check.result }}
          TESTS: ${{ needs.check.outputs.tests }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_SHA: ${{ github.sha }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not set — skipping notification."
            echo "Add it under Settings > Secrets and variables > Actions to enable this."
            exit 0
          fi

          if [ "$RESULT" = "success" ]; then
            COLOUR=3066993      # green
            STATUS="Build passed"
          else
            COLOUR=15158332     # red
            STATUS="Build failed"
          fi

          # Discord truncates hard at 4096 characters in a description, and a long commit
          # body would be cut mid-word. Take the subject line only.
          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
          SHORT_SHA=$(printf '%s' "$COMMIT_SHA" | cut -c1-7)

          # Built with jq so a commit message containing quotes, newlines or backslashes
          # cannot break the payload or inject fields.
          jq -n \
            --arg status  "$STATUS" \
            --arg subject "$SUBJECT" \
            --arg url     "$COMMIT_URL" \
            --arg sha     "$SHORT_SHA" \
            --arg author  "$AUTHOR" \
            --arg tests   "${TESTS:-unknown}" \
            --arg run     "$RUN_URL" \
            --argjson colour "$COLOUR" \
            '{
              username: "Aether",
              embeds: [{
                title: $subject,
                url: $url,
                color: $colour,
                fields: [
                  { name: "Status",  value: $status, inline: true },
                  { name: "Tests",   value: $tests,  inline: true },
                  { name: "Commit",  value: ("`" + $sha + "` by " + $author), inline: true }
                ],
                footer: { text: "Aether Space Program" }
              }],
              components: [{
                type: 1,
                components: [{ type: 2, style: 5, label: "View run", url: $run }]
              }]
            }' > payload.json

          curl -sS -f -X POST -H "Content-Type: application/json" \
               -d @payload.json "$WEBHOOK" \
            && echo "Posted to Discord." \
            || echo "Discord post failed; not failing the build over a notification."
