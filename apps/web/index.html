<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aether — Multi-Scale Precision Spike</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #000;
        color: #cfe3ff;
        font: 13px/1.5 ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
        overflow: hidden;
      }
      canvas { display: block; position: fixed; inset: 0; z-index: 0; }

      /* Telemetry sits above the dimming overlay so it stays legible before capture. */
      #hud, #help, #watermark { z-index: 20; }

      #hud {
        position: fixed; top: 16px; left: 16px;
        background: rgba(6, 10, 20, 0.78);
        border: 1px solid rgba(120, 170, 255, 0.22);
        border-radius: 8px;
        padding: 14px 16px;
        min-width: 300px;
        backdrop-filter: blur(8px);
        pointer-events: none;
      }
      #hud h1 {
        font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
        color: #d8e8ff; font-weight: 600; margin-bottom: 4px;
      }
      #hud .blurb {
        color: #8ba4c9; font-size: 11px; margin-bottom: 10px;
        padding-bottom: 8px; border-bottom: 1px solid rgba(120, 170, 255, 0.14);
      }
      .row { display: flex; justify-content: space-between; gap: 20px; }
      .row + .row { margin-top: 3px; }
      .k { color: #6f8ab5; }
      .v { color: #d8e8ff; font-variant-numeric: tabular-nums; }
      .warn { color: #ffb454; }
      .ok { color: #7ee081; }

      #help {
        position: fixed; bottom: 16px; left: 16px;
        background: rgba(6, 10, 20, 0.78);
        border: 1px solid rgba(120, 170, 255, 0.22);
        border-radius: 8px; padding: 12px 16px; max-width: 460px;
        pointer-events: none;
      }
      #help b { color: #d8e8ff; font-weight: 600; }
      #help p { color: #8ba4c9; margin-top: 6px; }

      #watermark {
        position: fixed; bottom: 16px; right: 16px;
        color: rgba(160, 185, 220, 0.55); font-size: 11px; max-width: 320px;
        text-align: right; pointer-events: none;
      }

      /*
        Visual only. `pointer-events: none` is load-bearing: the overlay covers the canvas,
        so without it the overlay intercepts the very click that is meant to dismiss it and
        the prompt can never be satisfied. Clicks fall through to the canvas beneath.
      */
      #click-to-start {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: rgba(0, 0, 0, 0.55); z-index: 10; pointer-events: none;
      }
      #click-to-start span {
        border: 1px solid rgba(120, 170, 255, 0.35); border-radius: 8px;
        padding: 16px 28px; font-size: 14px; color: #d8e8ff;
        background: rgba(6, 10, 20, 0.8);
      }

      /* ── Mission selector ── */
      /* Above the overlay (z-index 10) so the selector stays usable when the mouse is
         released with Escape, rather than being greyed out and unclickable. */
      #missions {
        position: fixed; top: 16px; right: 16px; bottom: 56px; width: 330px;
        z-index: 20;
        overflow-y: auto; padding: 14px 16px;
        background: rgba(6, 10, 20, 0.86);
        border: 1px solid rgba(120, 170, 255, 0.22);
        border-radius: 8px; backdrop-filter: blur(8px);
        scrollbar-width: thin; scrollbar-color: rgba(120,170,255,0.3) transparent;
      }
      #missions h1 {
        font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
        color: #6f8ab5; font-weight: 600; margin-bottom: 10px;
      }
      #missions h2 {
        font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
        color: #56709a; font-weight: 600; margin: 14px 0 6px;
      }
      .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
      .preset {
        font: inherit; font-size: 11px; cursor: pointer;
        background: rgba(50, 90, 150, 0.28); color: #b6cdf0;
        border: 1px solid rgba(120, 170, 255, 0.28);
        border-radius: 5px; padding: 4px 8px;
      }
      .preset:hover { background: rgba(70, 120, 190, 0.45); color: #eaf3ff; }

      .evidence {
        border: 1px solid rgba(120, 170, 255, 0.16);
        border-radius: 6px; padding: 10px; margin-bottom: 4px;
        background: rgba(20, 32, 54, 0.5);
      }
      .meter {
        height: 4px; border-radius: 2px; margin-bottom: 9px;
        background: rgba(120, 170, 255, 0.14); overflow: hidden;
      }
      .meter .fill { height: 100%; background: #5ea8ff; transition: width 0.25s ease; }
      .evidence .desc { color: #8ba4c9; margin-top: 8px; font-size: 12px; }
      .evidence .projected {
        color: #ffb454; margin-top: 8px; font-size: 12px;
        border-top: 1px solid rgba(255, 180, 84, 0.2); padding-top: 8px;
      }

      .mission {
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-areas: "box name tag" "box meta count";
        gap: 0 8px; align-items: center;
        padding: 5px 6px; border-radius: 5px; cursor: pointer;
      }
      .mission:hover { background: rgba(90, 140, 210, 0.13); }
      .mission input { grid-area: box; accent-color: #5ea8ff; cursor: pointer; }
      .mission .name { grid-area: name; color: #d8e8ff; }
      .mission .meta { grid-area: meta; color: #6f8ab5; font-size: 11px; }
      .mission .tag {
        grid-area: tag; font-size: 10px; color: #7ee081;
        border: 1px solid rgba(126, 224, 129, 0.3); border-radius: 3px; padding: 1px 4px;
      }
      .mission .count {
        grid-area: count; font-size: 11px; color: #6f8ab5;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="help">
      <b>W A S D</b> move &nbsp; <b>R / F</b> up / down &nbsp; <b>Shift</b> boost &nbsp;
      <b>Wheel</b> throttle &nbsp; <b>Esc</b> release mouse
      <p>
        You start in low Earth orbit. Every planet is on its real Keplerian orbit at today's
        date; terrain is generated live as you approach a world and released as you leave.
      </p>
    </div>
    <div id="watermark"></div>
    <div id="click-to-start"><span>Click to capture mouse</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
